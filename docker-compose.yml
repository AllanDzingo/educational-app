version: "3.9"

services:
  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"

  learning-service:
    build: ./learning-service
    ports:
      - "3002:3002"

  payment-service:
    build: ./payment-service
    ports:
      - "3003:3003"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - learning-service
      - payment-service

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
