services:
  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    depends_on:
      - mongo

  learning-service:
    build: ./learning-service
    ports:
      - "3002:3002"

  payment-service:
    build: ./payment-service
    ports:
      - "3003:3003"

  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    depends_on:
      - auth-service
      - learning-service
      - payment-service

  frontend:
    build: ./frontend
    ports:
      - "5173:80"

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
