apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    team: edu-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        team: edu-app
    spec:
      containers:
        - name: frontend
          image: educationalapp-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    team: edu-app
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 80
