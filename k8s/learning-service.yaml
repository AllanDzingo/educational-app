apiVersion: apps/v1
kind: Deployment
metadata:
  name: learning-service
  labels:
    team: edu-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: learning-service
  template:
    metadata:
      labels:
        app: learning-service
        team: edu-app
    spec:
      containers:
        - name: learning-service
          image: educationalapp-learning-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3002
---
apiVersion: v1
kind: Service
metadata:
  name: learning-service
  labels:
    team: edu-app
spec:
  selector:
    app: learning-service
  ports:
    - port: 3002
      targetPort: 3002
