apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  labels:
    team: edu-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
        team: edu-app
    spec:
      containers:
        - name: auth-service
          image: educationalapp-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 3001
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  labels:
    team: edu-app
spec:
  selector:
    app: auth-service
  ports:
    - port: 3001
      targetPort: 3001
