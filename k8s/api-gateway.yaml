apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    team: edu-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
        team: edu-app
    spec:
      containers:
        - name: api-gateway
          image: educationalapp-api-gateway:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    team: edu-app
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 8000
      targetPort: 8000
